 <div class="card"><h2>Timestamp diagnostics</h2>${d.at?R("Timezone used",esc(d.tz)+"<br>"+esc(d.src))+R("Raw newest timestamp",esc(d.rawNew??"—"))+R("Parsed newest (UTC)",has?new Date(d.parsedNew).toISOString():"—")+R("Current time (UTC)",new Date(now).toISOString())+R("Data age",has?(age<0?"−":"")+ago(Math.abs(age)).replace(" ago",""):"—")+R("Inside market-closed window?",has?(inClosed(d.parsedNew)?'<b class="dn">yes: newest candle is in the Fri 22:00–Sun 21:00 UTC closure</b>':"no"):"—")+R("Raw oldest timestamp",esc(d.rawOld??"—"))+R("Candle order in response",d.order+" · "+(d.dup||0)+" duplicate(s) removed")+R("Candles",`${d.total} received · ${d.valid} accepted · ${d.bad} invalid · ${d.fut} rejected (future)`)+R("Response meta",esc(JSON.stringify(d.meta||{})))+R("First raw candle",esc(JSON.stringify(d.sample||{})))+(/assumed/.test(d.src||"")?'<p class="dn sm">⚠ Timezone unverified: the response doesn’t state one, so UTC is only an assumption.</p>':"")+(hint?`<p class="dn sm">⚠ ${esc(hint)}</p><button class="s" id="sho">Try UTC${off} (saves; revert anytime)</button>`:""):'<p class="m sm">No response parsed yet. Tap Refresh.</p>'}<p class="m sm">Rules: numbers are Unix seconds or milliseconds; strings with Z or an offset are exact; zone-less date-times use the timezone shown above. Candles more than 2 minutes in the future are rejected, never shifted or ignored silently.</p></div>
 <div class="card"><h2>Timestamp settings</h2><label>Zone-less timestamps are in</label><select id="stz"><option value="auto">Auto (response meta, else UTC)</option><option value="UTC">Always UTC</option><option value="custom">Custom offset / IANA zone</option></select><label>Custom (e.g. +06:00 or America/New_York)</label><input id="stc" value="${esc(SET.tzCustom)}" placeholder="+00:00"><label><input type="checkbox" id="sau" style="width:auto" ${SET.askUtc?"checked":""}> Ask the Worker for UTC (adds &amp;timezone=UTC; only helps if your Worker forwards it)</label><label><input type="checkbox" id="sat" style="width:auto" ${SET.auto?"checked":""}> Auto-refresh</label><button id="ssv">Save and reload data</button><div class="err" id="serr"></div></div>
 <div class="card"><h2>How to verify the real timezone</h2><p class="sm">Twelve Data documents UTC as the default for forex-type pairs, but your sample doesn’t match that, so something between Twelve Data and this app may differ.</p><p class="sm">1. In Safari open this, with your own key, and note the newest datetime:<br><code>https://api.twelvedata.com/time_series?symbol=XAU/USD&amp;interval=1min&amp;outputsize=3&amp;timezone=UTC&amp;apikey=YOURKEY</code><br>2. Open your Worker URL for 1min and compare. Same time = the Worker passes it through. Different = the Worker changes timestamps.<br>3. Send me your Worker code (it holds no key) so I can check for a timezone or date step.</p><textarea id="rpt" rows="5" readonly placeholder="Tap “Show report” to build a summary you can send."></textarea><button class="s" id="srp">Show report to copy</button></div>
 <div class="card"><h2>Test every timeframe</h2><button class="s" id="spb">Run test (6 requests)</button>${PROBE.map(p=>`<div class="it sm"><b>${p.tf}</b> ${p.ok?`<span class="up">OK</span> · ${p.n} candles · newest ${esc(p.raw)} → ${p.iso} (${p.age})`:`<span class="dn">${esc(p.err)}</span>`}</div>`).join("")}</div>
 <div class="card"><h2>About</h2><p class="m sm">GoldPilot AI is a rule-based analysis tool. It uses <b>no AI service</b>, places <b>no real orders</b> and holds no API key: the key stays in your Cloudflare Worker. Market data: Twelve Data via your Worker. Nothing here is financial advice.</p></div>`;
 $("#stz").value=SET.tz;if($("#sho"))$("#sho").onclick=()=>{SET.tz="custom";SET.tzCustom=off;saveSet();loadData(true).then(()=>vSet())};
 $("#srp").onclick=()=>{const t=["GoldPilot diagnostics","Now (UTC): "+new Date().toISOString(),"Device timezone: "+Intl.DateTimeFormat().resolvedOptions().timeZone,"Timeframe: "+TF,"Request: "+(d.url||"—"),"Timezone used: "+(d.tz||"—")+" ("+(d.src||"—")+")","Raw newest: "+d.rawNew,"Parsed newest UTC: "+(has?new Date(d.parsedNew).toISOString():"—"),"Raw oldest: "+d.rawOld,"Order: "+d.order,"Candles: "+d.total+" received, "+d.valid+" accepted, "+d.bad+" invalid, "+d.fut+" future","Meta: "+JSON.stringify(d.meta),"First raw candle: "+JSON.stringify(d.sample),"Status: "+ST.s+" · "+(ST.warn||ST.note||"")].join("\n"),r=$("#rpt");r.value=t;try{r.select();navigator.clipboard&&navigator.clipboard.writeText(t)}catch(e){}};
 $("#sr").onclick=()=>loadData(true).then(()=>vSet());
 $("#ssv").onclick=()=>{const c=$("#stc").value.trim();if($("#stz").value==="custom"&&!(/^[+-]\d\d:?\d\d$/.test(c)||isFinite(tzOff(Date.now(),c)))){$("#serr").textContent="Enter an offset like +06:00 or a valid zone name.";return}SET.tz=$("#stz").value;SET.tzCustom=c;SET.askUtc=$("#sau").checked;SET.auto=$("#sat").checked;saveSet();loadData(true).then(()=>vSet())};
 $("#spb").onclick=async()=>{PROBE=[];for(const tf of Object.keys(TFS)){try{const c=await Provider.once(tf),l=c[c.length-1];PROBE.push({tf,ok:true,n:c.length,raw:DG.rawNew,iso:new Date(l.t).toISOString().slice(0,16)+"Z",age:ago(Date.now()-l.t)})}catch(e){PROBE.push({tf,ok:false,err:e.message})}vSet()}}}
/* ---------- LIVE LOADING / NAV / BOOT ---------- */
let TF=TFS[store.get("gp_tf","1min")]?store.get("gp_tf","1min"):"1min",ST={s:"unavailable",warn:"",note:"",upd:0},V=null,CTF=null,lastF=0,fails=0,busy=false;
function setBadge(t){const b=$("#bdg"),m={fresh:["LIVE · "+TFS[TF][0],"live"],stale:["STALE · "+TFS[TF][0],"dly"],unavailable:["NO DATA","bad"]},[x,k]=t?[t,""]:m[ST.s];b.textContent=x;b.className="badge "+k}
function checkPaper(){const q=PA.pos;if(!q||!q.et||ST.s==="unavailable")return;for(const k of C){if(k.t<=q.et)continue;const sl=q.dir>0?k.l<=q.sl:k.h>=q.sl,tp=q.dir>0?k.h>=q.tp:k.l<=q.tp;if(sl||tp){closePaper(sl?q.sl:q.tp,sl?"stop loss":"take profit");return}}}
async function loadData(){if(busy)return;busy=true;lastF=Date.now();setBadge("LOADING…");
 try{const c=await Provider.fetchLive(TF);C=c;CTF=TF;fails=0;ST={...fresh(c),warn:"",upd:Date.now()}}
 catch(e){fails++;if(CTF===TF&&C.length){const u=ST.upd;ST={...fresh(C),warn:"Refresh failed: "+e.message+". Showing the last data received at "+hm(u)+".",upd:u};ST.s="stale"}else{C=[];CTF=null;ST={s:"unavailable",warn:e.message,note:"",upd:0}}}
 finally{busy=false}
 try{A=C.length?analyse(C):null;V=C.length?evaluate(C,A,ST):null;logAnalysis();checkPaper()}catch(e){V=null;ST.warn=(ST.warn?ST.warn+" ":"")+"Analysis error: "+e.message}setBadge()}
async function switchTF(tf){if(!TFS[tf]||busy)return;TF=tf;store.set("gp_tf",tf);await loadData();vDash()}
const tabs=[["📈","Chart","#v0",vDash],["📒","Journal","#v2",vJournal],["🎮","Paper","#v3",vPaper],["🧮","Size","#v1",vCalc],["🧪","Backtest","#v4",vTest],["⚙️","Settings","#v5",vSet]];
function show(i){try{tabs[i][3]()}catch(e){$(tabs[i][2]).innerHTML='<div class="card dn">This tab hit an error: '+esc(e.message)+"</div>"}document.querySelectorAll(".v").forEach(e=>e.classList.toggle("on","#"+e.id===tabs[i][2]));document.querySelectorAll("nav a").forEach((e,j)=>e.classList.toggle("on",i==j));scrollTo(0,0)}
$("#nav").innerHTML=tabs.map((t,i)=>`<a href="#" data-i="${i}"><b>${t[0]}</b>${t[1]}</a>`).join("");
$("#nav").onclick=e=>{const a=e.target.closest("a");if(a){e.preventDefault();show(+a.dataset.i)}};
setBadge("LOADING…");loadData().then(()=>show(0));
setInterval(async()=>{const base=TFS[TF][1]<=900?6e4:3e5;if(!SET.auto||document.hidden||busy||Date.now()-lastF<base*Math.min(2**fails,5))return;await loadData();if($("#v0").classList.contains("on"))vDash()},15e3);
addEventListener("online",()=>loadData().then(()=>{if($("#v0").classList.contains("on"))vDash()}));
addEventListener("resize",()=>{if($("#v0").classList.contains("on"))draw()});
